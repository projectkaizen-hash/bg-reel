<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News photo-card reel template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef0ec;
  --panel: #ffffff;
  --ink: #15191c;
  --muted: #5d666b;
  --line: #d5dad6;
  --field: #f4f6f3;
  --accent: #0a9b62;
  --accent-ink: #ffffff;
  --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412;
    --panel: #181e1b;
    --ink: #e8ede9;
    --muted: #93a09a;
    --line: #2b3430;
    --field: #202823;
    --accent: #2fc88a;
    --accent-ink: #06130d;
    --danger: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #101412;
  --panel: #181e1b;
  --ink: #e8ede9;
  --muted: #93a09a;
  --line: #2b3430;
  --field: #202823;
  --accent: #2fc88a;
  --accent-ink: #06130d;
  --danger: #ff8a80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", Roboto, "Nirmala UI", sans-serif;
  font-size: 15px;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
.app {
  display: grid;
  grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
  gap: 24px;
  max-width: 1180px;
  margin: 0 auto;
  padding: 20px 16px 48px;
  align-items: start;
}
.left { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage { background: #000; border-radius: 22px; overflow: hidden; width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 9 / 16; box-shadow: 0 1px 0 var(--line), 0 18px 40px rgba(0,0,0,.18); }
.stage canvas { display: block; width: 100%; height: 100%; }
.transport { display: flex; align-items: center; gap: 10px; max-width: 360px; width: 100%; margin: 0 auto; }
.transport input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 10px; padding: 8px 13px; cursor: pointer; font-weight: 600; font-size: 14px; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.recrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 360px; width: 100%; margin: 0 auto; }
.status { color: var(--muted); font-size: 13px; }
#result { max-width: 360px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
#result video { width: 100%; border-radius: 14px; background: #000; max-height: 420px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; max-width: 360px; width: 100%; margin: 0 auto; }
.panel h2 { margin: 0 0 12px; font-size: 15px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); }
.field input[type=text], .field select, .field textarea, .card input[type=text], .card textarea {
  width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 9px; padding: 8px 10px; min-width: 0;
}
.field input[type=color] { width: 100%; height: 38px; padding: 2px; border: 1px solid var(--line); background: var(--field); border-radius: 9px; }
.field input[type=range] { accent-color: var(--accent); width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { accent-color: var(--accent); width: 18px; height: 18px; }
main h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.25; }
main > header > p { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
#list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.card.off { opacity: .55; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-h .btns { display: flex; gap: 6px; }
.card-body { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; }
.thumb { width: 112px; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: var(--field); border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fields textarea { resize: vertical; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 460px); z-index: 20; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.fetchbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
.fetchbar[hidden] { display: none; }
.fetchbar .inl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.fetchbar select { border: 1px solid var(--line); background: var(--field); border-radius: 9px; padding: 7px 8px; max-width: 200px; }
.fetchbar details { flex-basis: 100%; }
.fetchbar summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.fetchbar details .grid2 { margin-top: 10px; }
.fetchbar .status { flex-basis: 100%; min-height: 1.2em; }
@media (min-width: 861px) {
  .left { max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 4px; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .left { position: static; }
}
@media (max-width: 420px) {
  .card-body { grid-template-columns: 88px minmax(0, 1fr); }
  .thumb { width: 88px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="left" aria-label="Preview and settings">
    <div class="stage"><canvas id="cv" width="1080" height="1920" aria-label="Reel preview"></canvas></div>
    <div class="transport">
      <button class="btn small" id="play" type="button">Play</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="recrow">
      <button class="btn primary" id="rec" type="button">Record video</button>
      <span class="status" id="recStatus"></span>
    </div>
    <div id="result" hidden>
      <video id="resVideo" controls playsinline></video>
      <button class="btn" id="saveVid" type="button">Save video</button>
    </div>

    <section class="panel" aria-labelledby="sh">
      <h2 id="sh">Reel settings</h2>
      <label class="field"><span>Brand name</span><input type="text" data-s="brand"></label>
      <label class="field"><span>Opening title</span><input type="text" data-s="title"></label>
      <label class="field"><span>Date line (leave empty for today's date)</span><input type="text" data-s="date" placeholder="Auto"></label>
      <div class="grid2">
        <label class="field"><span>Closing headline</span><input type="text" data-s="outroTitle"></label>
        <label class="field"><span>Closing link / line</span><input type="text" data-s="outroSub"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Card layout</span>
          <select data-s="layout">
            <option value="overlay">Full photo, text on top</option>
            <option value="split">Photo above, text panel below</option>
          </select>
        </label>
        <label class="field"><span>Text panel (split layout)</span>
          <select data-s="panel"><option value="dark">Dark</option><option value="light">Light</option></select>
        </label>
      </div>
      <div class="grid2">
        <label class="field"><span>Accent colour</span><input type="color" data-s="accent"></label>
        <label class="field"><span>Seconds per card: <b id="durLabel">5</b></span><input type="range" min="3" max="10" step="0.5" data-s="dur"></label>
      </div>
      <label class="check"><input type="checkbox" data-s="progress"> Story-style progress bar</label>
    </section>
  </aside>

  <main>
    <header>
      <h1>News photo-card reel</h1>
      <p>Connect your site once, then fetch your latest posts in one click, tweak the cards, then record a vertical 1080×1920 video. Your wording and settings are remembered in this browser; use Export to keep the photos too.</p>
    </header>
    <section class="fetchbar" id="fetchBar" aria-label="Fetch posts from your site">
      <details id="connBox">
        <summary>Site connection</summary>
        <div class="grid2">
          <label class="field"><span>Site address</span><input type="text" id="cUrl" placeholder="https://yoursite.com" autocomplete="off" spellcheck="false"></label>
          <label class="field"><span>API key (Settings &rarr; News Reel API)</span><input type="text" id="cKey" autocomplete="off" spellcheck="false"></label>
        </div>
      </details>
      <button class="btn primary" id="fetchBtn" type="button">Fetch latest posts</button>
      <label class="inl"><span>Posts</span>
        <select id="fCount"><option>5</option><option>6</option><option>8</option><option>10</option><option>12</option><option>15</option></select>
      </label>
      <label class="inl"><span>Category</span>
        <select id="fCat"><option value="">All categories</option></select>
      </label>
      <label class="check"><input type="checkbox" id="fToday"> Today only</label>
      <span class="status" id="fStatus" role="status"></span>
    </section>
    <div class="toolbar">
      <button class="btn" id="addCard" type="button">Add card</button>
      <label class="btn" style="cursor:pointer">Add photos in order<input id="bulk" type="file" accept="image/*" multiple class="visually-hidden"></label>
      <button class="btn" id="exportT" type="button">Export template</button>
      <label class="btn" style="cursor:pointer">Import template<input id="importT" type="file" accept="application/json,.json" class="visually-hidden"></label>
      <button class="btn ghost" id="resetT" type="button">Reset to sample cards</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- constants & helpers ---------- */
  var W = 1080, H = 1920;
  var FONT = '"Noto Sans Bengali","Hind Siliguri","Kalpurush","Nirmala UI","Noto Sans",sans-serif';
  var INTRO = 2.6, OUTRO = 3.2;
  var KEY = "news-reel-template-v1";
  var BN = "০১২৩৪৫৬৭৮৯";
  var MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  function bn(n) { return String(n).replace(/\d/g, function (d) { return BN[d]; }); }
  function autoDate() { var d = new Date(); return bn(d.getDate()) + " " + MONTHS[d.getMonth()] + " " + bn(d.getFullYear()); }
  function clamp(v, a, b) { return Math.min(b === undefined ? 1 : b, Math.max(a === undefined ? 0 : a, v)); }
  function ease(x) { return 1 - Math.pow(1 - x, 3); }
  function anim(lt, delay, dur) { return clamp((lt - delay) / dur); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function $(id) { return document.getElementById(id); }

  function hex2rgb(h) {
    h = String(h || "#000").replace("#", "");
    if (h.length === 3) h = h.split("").map(function (x) { return x + x; }).join("");
    var n = parseInt(h, 16); if (isNaN(n)) n = 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(h, t, a) {
    var c = hex2rgb(h), d = hex2rgb(t);
    return "rgb(" + c.map(function (v, i) { return Math.round(v + (d[i] - v) * a); }).join(",") + ")";
  }
  function onAccent(h) {
    var c = hex2rgb(h);
    var l = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
    return l > 0.62 ? "#111111" : "#ffffff";
  }

  /* ---------- state ---------- */
  var SRC = "বাংলা গেজেটা";
  var SEED = [
    { on: true, cat: "বিশ্ব", head: "হরমুজ প্রণালীতে থাই ট্যাংকারে হামলা", blurb: "প্রণালি এলাকায় দুটি তেলবাহী ট্যাংকারে ‘অজ্ঞাত বস্তু’র আঘাত। হতাহতের খবর নেই, তদন্ত চলছে।", src: SRC },
    { on: true, cat: "সারাদেশ", head: "এয়ারপোর্ট কাণ্ডে জামায়াত নেতা আখতারুজ্জামান রিমান্ডে", blurb: "বিমানবন্দরে বিশৃঙ্খলা, সরকারি কাজে বাধা ও নিরাপত্তা কর্মকর্তাকে লাঞ্ছিত করার অভিযোগ।", src: SRC },
    { on: true, cat: "খেলা", head: "এশিয়ান গেমসে ব্যর্থতার কারণ জানালেন লিটন দাস", blurb: "প্রথমবারের মতো পদক ছাড়াই ফিরছে বাংলাদেশ পুরুষ ক্রিকেট দল।", src: SRC },
    { on: true, cat: "অর্থনীতি", head: "সেপ্টেম্বরে বাংলাদেশের রপ্তানি আয় ৩.৯৪ বিলিয়ন ডলার", blurb: "পণ্য রপ্তানি আয়ে প্রবৃদ্ধি ৮.৫৪ শতাংশ।", src: SRC },
    { on: true, cat: "সারাদেশ", head: "রূপগঞ্জে কিশোরীকে দলবদ্ধ ধর্ষণের অভিযোগ, গ্রেপ্তার ৩", blurb: "", src: SRC },
    { on: true, cat: "ফ্যাক্টচেক", head: "সামাজিক মাধ্যমে ছড়ানো স্বরাষ্ট্রমন্ত্রীর বক্তব্য ভুয়া: রিউমর স্ক্যানার", blurb: "", src: SRC },
    { on: true, cat: "বিনোদন", head: "নাম বদলেই বদলে গেল ইধিকা পালের ক্যারিয়ার", blurb: "ছোটপর্দা দিয়ে শুরু করে টালিউড ও ঢালিউডে পরিচিত মুখ হয়ে উঠেছেন অভিনেত্রী।", src: SRC },
    { on: true, cat: "সারাদেশ", head: "ময়মনসিংহে বাসের চাপায় একই পরিবারের চারজনসহ নিহত ৭", blurb: "যাত্রীবাহী বাস ও সিএনজি অটোরিকশার মুখোমুখি সংঘর্ষ; নিহতদের মধ্যে এক অন্তঃসত্ত্বা নারী।", src: SRC },
    { on: true, cat: "জাতীয়", head: "ঢাকার সাব-রেজিস্টারদের পোস্টিং হবে লটারিতে: আইনমন্ত্রী", blurb: "পোস্টিংয়ে লটারি ব্যবস্থা চালুর উদ্যোগ নেওয়া হচ্ছে বলে জানিয়েছেন আইনমন্ত্রী।", src: SRC }
  ];
  var DEFAULTS = { brand: "বাংলা গেজেটা", title: "আজকের শিরোনাম", date: "", outroTitle: "বিস্তারিত পড়ুন", outroSub: "banglagazeta.com", layout: "overlay", panel: "dark", accent: "#0a9b62", dur: 5, progress: true };
  var S = Object.assign({}, DEFAULTS);
  var cards = SEED.map(function (c) { return Object.assign({ img: null, _el: null }, c); });

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ settings: S, cards: cards.map(function (c) { return { on: c.on, cat: c.cat, head: c.head, blurb: c.blurb, src: c.src }; }) }));
    } catch (e) { /* storage unavailable */ }
  }
  function restore() {
    try {
      var raw = localStorage.getItem(KEY); if (!raw) return;
      var o = JSON.parse(raw);
      if (o && o.settings && Array.isArray(o.cards) && o.cards.length) {
        S = Object.assign({}, DEFAULTS, o.settings);
        cards = o.cards.map(function (c) { return { on: c.on !== false, cat: c.cat || "", head: c.head || "", blurb: c.blurb || "", src: c.src || "", img: null, _el: null }; });
      }
    } catch (e) { /* ignore */ }
  }

  /* ---------- images ---------- */
  function loadEl(dataUrl) {
    return new Promise(function (res) {
      if (!dataUrl) { res(null); return; }
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { res(null); };
      im.src = dataUrl;
    });
  }
  function fileToDataUrl(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = rej;
      fr.onload = function () {
        var im = new Image();
        im.onerror = rej;
        im.onload = function () {
          var sc = Math.min(1, 2400 / Math.max(im.width, im.height));
          var c = document.createElement("canvas");
          c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.9));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  async function setPhoto(card, file) {
    try {
      card.img = await fileToDataUrl(file);
      card._el = await loadEl(card.img);
    } catch (e) { toast("That image could not be read. Try a JPG or PNG."); }
  }

  /* ---------- canvas drawing ---------- */
  var cv = $("cv"), ctx = cv.getContext("2d");

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function rrBottom(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.closePath();
  }
  function drawCover(img, x, y, w, h, z) {
    var ir = img.width / img.height, r = w / h, sw, sh;
    if (ir > r) { sh = img.height; sw = sh * r; } else { sw = img.width; sh = sw / r; }
    sw /= z; sh /= z;
    var sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);

  $("bulk").addEventListener("change", async function (e) {
    var files = Array.prototype.slice.call(e.target.files || []); if (!files.length) return;
    var targets = cards.filter(function (c) { return c.on; });
    for (var i = 0; i < files.length && i < targets.length; i++) await setPhoto(targets[i], files[i]);
    if (files.length > targets.length) toast(files.length - targets.length + " extra photo(s) skipped. Add cards to use them.");
    e.target.value = ""; renderList(); redraw();
  });
  $("resetT").addEventListener("click", function () {
    if (!window.confirm("Replace the current cards and settings with the sample cards? Photos you added will be removed.")) return;
    S = Object.assign({}, DEFAULTS);
    cards = SEED.map(function (c) { return Object.assign({ img: null, _el: null }, c); });
    syncSettings(); renderList(); persist(); t = 0; redraw();
  });
  $("exportT").addEventListener("click", function () {
    var payload = { version: 1, settings: S, cards: cards.map(function (c) { return { on: c.on, cat: c.cat, head: c.head, blurb: c.blurb, src: c.src, img: c.img }; }) };
    saveFile("news-reel-template.json", JSON.stringify(payload));
  });
  $("importT").addEventListener("change", async function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      var o = JSON.parse(await f.text());
      if (!o || !o.settings || !Array.isArray(o.cards)) throw new Error("bad");
      S = Object.assign({}, DEFAULTS, o.settings);
      cards = await Promise.all(o.cards.map(async function (c) {
        var img = typeof c.img === "string" && c.img.indexOf("data:image/") === 0 ? c.img : null;
        return { on: c.on !== false, cat: c.cat || "", head: c.head || "", blurb: c.blurb || "", src: c.src || "", img: img, _el: await loadEl(img) };
      }));
      syncSettings(); renderList(); persist(); t = 0; redraw(); toast("Template imported");
    } catch (err) { toast("That file isn't a reel template."); }
    e.target.value = "";
  });

  /* ---------- settings panel ---------- */
  function syncSettings() {
    document.querySelectorAll("[data-s]").forEach(function (el) {
      var k = el.getAttribute("data-s");
      if (el.type === "checkbox") el.checked = !!S[k]; else el.value = S[k];
    });
    $("durLabel").textContent = String(S.dur);
  }
  document.querySelectorAll("[data-s]").forEach(function (el) {
    el.addEventListener("input", function () {
      var k = el.getAttribute("data-s");
      S[k] = el.type === "checkbox" ? el.checked : (k === "dur" ? Number(el.value) : el.value);
      if (k === "dur") $("durLabel").textContent = String(S.dur);
      persist(); redraw();
    });
  });

  /* ---------- transport wiring ---------- */
  $("play").addEventListener("click", function () { if (playing) pause(); else play(); });
  $("scrub").addEventListener("input", function (e) { pause(); t = Number(e.target.value) / 1000 * total(); redraw(); });
  $("rec").addEventListener("click", startRec);
  $("saveVid").addEventListener("click", function () {
    if (!lastBlob) return;
    saveFile("news-reel-" + new Date().toISOString().slice(0, 10) + "." + lastExt, lastBlob);
  });

  /* ---------- Site fetch (News Reel Fetch API) ---------- */
  var CKEY = "news-reel-conn-v1", FKEY = "news-reel-fetch-v1";
  var conn = { url: "", key: "" };
  var fopt = { count: 8, cat: "", today: false };
  try { Object.assign(conn, JSON.parse(localStorage.getItem(CKEY) || "{}")); } catch (e) { /* ignore */ }
  try { Object.assign(fopt, JSON.parse(localStorage.getItem(FKEY) || "{}")); } catch (e) { /* ignore */ }
  function saveConn() { try { localStorage.setItem(CKEY, JSON.stringify(conn)); } catch (e) {} }
  function saveFopt() { try { localStorage.setItem(FKEY, JSON.stringify(fopt)); } catch (e) {} }

  function siteRoot() {
    var u = String(conn.url || "").trim().replace(/\/+$/, "");
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }
  function apiUrl(path, params, plain) {
    var root = siteRoot(), q = new URLSearchParams(params || {});
    if (conn.key && conn.key.trim()) q.set("key", conn.key.trim());
    if (plain) { q.set("rest_route", "/news-reel/v1" + path); return root + "/?" + q.toString(); }
    return root + "/wp-json/news-reel/v1" + path + "?" + q.toString();
  }
  function viaSite(u) {
    try { var x = new URL(u); if (x.pathname.indexOf("/wp-json/") === 0) return siteRoot() + x.pathname + x.search; } catch (e) { /* keep as is */ }
    return u;
  }
  async function diagnose() {
    var root = siteRoot();
    var here = (location.protocol === "file:" || location.origin === "null") ? "null (local file)" : location.origin;
    if (location.protocol === "https:" && /^http:\/\//i.test(root)) return "Blocked: this page is HTTPS but the site address starts with http://. Use https:// for the site address.";
    try { await fetch(root + "/", { mode: "no-cors" }); }
    catch (e) { return "Can't reach " + root + " at all. Check the spelling and that the site is online, then try with or without www."; }
    try {
      var probe = await fetch(apiUrl("/categories", {}, false), { mode: "no-cors", redirect: "manual" });
      if (probe && probe.type === "opaqueredirect") return "Your site redirects this request (usually http to https, or between www and non-www). Change the Site address to the exact final address shown in your browser when you open the site, for example https://www.yoursite.com.";
    } catch (e) { /* this probe is optional; fall through */ }
    return "The site is reachable, but the browser blocked the data (CORS). Origin of this page: " + here + ". In WordPress open Settings > News Reel API, set Allowed origins to * and save. If it is already *, confirm the plugin is active and that no cache or security plugin strips headers.";
  }
  async function api(path, params) {
    if (!siteRoot()) throw new Error("Enter your site address under Site connection.");
    var r;
    try { r = await fetch(apiUrl(path, params, false)); if (r.status === 404) r = await fetch(apiUrl(path, params, true)); }
    catch (e) { throw new Error(await diagnose()); }
    if (r.status === 401) throw new Error("The API key was rejected.");
    if (r.status === 404) throw new Error("API not found. Is the News Reel Fetch API plugin active?");
    if (!r.ok) throw new Error("Server error " + r.status + ".");
    try { return await r.json(); } catch (e) { throw new Error("The site did not return JSON."); }
  }
  async function loadCats() {
    var sel = $("fCat");
    sel.length = 1;
    if (!siteRoot()) return;
    try {
      var d = await api("/categories");
      (d.categories || []).forEach(function (c) {
        var o = document.createElement("option"); o.value = String(c.id); o.textContent = c.name + " (" + c.count + ")"; sel.appendChild(o);
      });
      sel.value = String(fopt.cat || ""); if (sel.value !== String(fopt.cat || "")) { sel.value = ""; fopt.cat = ""; }
    } catch (e) { /* categories are optional */ }
  }

  function initFetchBar() {
    $("cUrl").value = conn.url || ""; $("cKey").value = conn.key || "";
    if (!conn.url) $("connBox").open = true;
    $("fCount").value = String(fopt.count);
    if ($("fCount").value !== String(fopt.count)) $("fCount").value = "8";
    $("fToday").checked = !!fopt.today;
    function onConn() { conn.url = $("cUrl").value; conn.key = $("cKey").value; saveConn(); }
    $("cUrl").addEventListener("input", onConn); $("cKey").addEventListener("input", onConn);
    $("cUrl").addEventListener("change", loadCats); $("cKey").addEventListener("change", loadCats);
    $("fCount").addEventListener("change", function () { fopt.count = Number($("fCount").value); saveFopt(); });
    $("fCat").addEventListener("change", function () { fopt.cat = $("fCat").value; saveFopt(); });
    $("fToday").addEventListener("change", function () { fopt.today = $("fToday").checked; saveFopt(); });
    $("fetchBtn").addEventListener("click", fetchPosts);
    loadCats();
  }

  var fetching = false;
  async function fetchPosts() {
    if (fetching || recording) return;
    fetching = true;
    var btn = $("fetchBtn"), st = $("fStatus");
    btn.disabled = true; pause(); st.textContent = "Fetching posts…";
    try {
      var params = { count: fopt.count };
      if (fopt.cat) params.category = fopt.cat;
      if (fopt.today) params.today = 1;
      var data = await api("/posts", params);
      var posts = data.posts || [];
      if (!posts.length) {
        st.textContent = fopt.today ? "No posts published today. Untick “Today only” to get the latest ones." : "No published posts found for that selection.";
        return;
      }
      $("connBox").open = false;
      var next = posts.map(function (p) {
        return { on: true, cat: p.category || "", head: p.title || "", blurb: p.excerpt || "", src: S.brand || "", img: null, _el: null, _px: p.image && (p.image.proxy || p.image.url) || "" };
      });
      cards = next; t = 0; renderList(); persist(); redraw();
      var withImg = next.filter(function (c) { return c._px; }).length, done = 0;
      if (withImg) st.textContent = "Loading photos 0/" + withImg + "…";
      await Promise.all(next.map(async function (c) {
        if (!c._px) return;
        try {
          var r = await fetch(viaSite(c._px));
          if (!r.ok) throw new Error("img " + r.status);
          c.img = await fileToDataUrl(await r.blob()); c._el = await loadEl(c.img);
        } catch (e) { /* leave this card without a photo */ }
        done++; st.textContent = "Loading photos " + done + "/" + withImg + "…"; redraw();
      }));
      var ok = next.filter(function (c) { return c.img; }).length;
      renderList(); redraw();
      st.textContent = next.length + " posts loaded, " + ok + " with photos." + (ok < next.length ? " Add photos to the rest below." : " Press Play or Record video.");
    } catch (e) {
      st.textContent = "Fetch failed: " + ((e && e.message) || "unknown error");
    } finally {
      fetching = false; btn.disabled = false;
    }
  }

  /* ---------- init ---------- */
  restore();
  initFetchBar();
  syncSettings();
  renderList();
  draw(0); updateUI();
  ensureFonts().then(function () { redraw(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { redraw(); });
})();
</script>
</body>
</html>
