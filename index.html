<!DOCTYPE html>
<html lang="bn">
<head>

<title>Bangla Gazeta · Reel Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&display=swap">
<style>

:root[data-theme="dark"]{--bg:#0b0f0d;--bar:#111715;--panel:#151b18;--ink:#e8ede9;--muted:#8f9c96;--line:#25302b;--field:#1c2420;--accent:#2fc88a;--accent-ink:#06130d;--shadow:0 1px 0 #25302b,0 14px 34px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,"Nirmala UI",sans-serif}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--bar);border-bottom:1px solid var(--line)}
.top .logo{width:34px;height:34px;flex:none}
.top h1{margin:0;font-size:16px;line-height:1.2}
.top h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted)}

@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.app{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:24px;max-width:1200px;margin:0 auto;padding:22px 16px 56px;align-items:start}
.left{position:sticky;top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{background:#000;border-radius:24px;overflow:hidden;width:100%;max-width:360px;margin:0 auto;aspect-ratio:9/16;box-shadow:var(--shadow)}
.stage canvas{display:block;width:100%;height:100%}
.w360{max-width:360px;width:100%;margin:0 auto}
.transport{display:flex;align-items:center;gap:10px}
.transport input{flex:1;min-width:0;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
#tl{display:flex;gap:3px;height:34px}

#tl button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
#tl button.off{opacity:.35}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}.btn.ghost{background:transparent}.btn[disabled]{opacity:.5;cursor:not-allowed}
.recrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{color:var(--muted);font-size:13px}
#result{display:flex;flex-direction:column;gap:10px}
#result video{width:100%;border-radius:14px;background:#000;max-height:420px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted)}
.field input[type=text],.field select,.card input[type=text],.card textarea,.bar select{width:100%;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:8px 10px;min-width:0}
.field input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);background:var(--field);border-radius:9px}
.field input[type=range]{accent-color:var(--accent);width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{accent-color:var(--accent);width:18px;height:18px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.bar select{width:auto;max-width:200px}
.bar .inl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.bar .status{flex-basis:100%;min-height:1.2em}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
#list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.off{opacity:.55}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-h .btns{display:flex;gap:6px}

.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fields{display:flex;flex-direction:column;gap:8px;min-width:0}.fields textarea{resize:vertical}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,460px);z-index:20}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{color:var(--muted);font-size:13px;margin:0}
.logoprev{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logoprev img{height:40px;max-width:160px;object-fit:contain;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:4px}

@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.left{position:static}.top .chip{display:none}}

</style>
</head>
<body>
<header class="top">
  <svg class="logo" id="topLogo" viewBox="0 0 96 96" aria-hidden="true"></svg>
  <h1>Reel Studio<small>Bangla Gazeta · 1080×1920 news reels</small></h1>
  <span class="sp"></span>
  <span class="chip"><i></i>banglagazeta.com connected</span>
  <button class="btn primary" id="rec" type="button">Record video</button>
</header>

<div class="app">
  <aside class="left" aria-label="Preview">
    <div class="stage"><canvas id="cv" width="1080" height="1920" aria-label="Reel preview"></canvas></div>

    </div>
    <div class="w360" id="tl" aria-label="Scenes"></div>
    <div class="recrow w360"><span class="status" id="recStatus"></span></div>
    <div id="result" class="w360" hidden>
      <video id="resVideo" controls playsinline></video>
      <button class="btn" id="saveVid" type="button">Save video</button>
    </div>
  </aside>

  <main>
    <section class="panel" aria-labelledby="hs">
      <h2 id="hs">Source</h2>
      <div class="bar">
        <button class="btn primary" id="fetchBtn" type="button">Fetch latest posts</button>
        <label class="inl"><span>Posts</span><select id="fCount"><option>5</option><option>6</option><option>8</option><option>10</option><option>12</option><option>15</option></select></label>
        <label class="inl"><span>Category</span><select id="fCat"><option value="">All categories</option></select></label>
        <label class="check"><input type="checkbox" id="fToday"> Today only</label>
        <span class="status" id="fStatus" role="status"></span>
      </div>
    </section>

    <section class="panel" aria-labelledby="sh">
      <h2 id="sh">Brand and style</h2>
      <div class="logoprev"><img id="logoImg" alt="Logo preview">
        <label class="btn small" style="cursor:pointer">Upload logo (SVG/PNG)<input id="logoUp" type="file" accept="image/svg+xml,image/png,image/webp,image/jpeg" class="vh"></label>
        <button class="btn small ghost" id="logoReset" type="button">Use default</button></div>
      <div class="grid2">
        <label class="field"><span>Brand name (beside default logo)</span><input type="text" data-s="brand"></label>
        <label class="field"><span>Opening title</span><input type="text" data-s="title"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Date line (empty = today)</span><input type="text" data-s="date" placeholder="Auto"></label>
        <label class="field"><span>Closing headline</span><input type="text" data-s="outroTitle"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Closing link</span><input type="text" data-s="outroSub"></label>
        <label class="field"><span>Accent colour</span><input type="color" data-s="accent"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Card layout</span><select data-s="layout"><option value="overlay">Full photo, text on top</option><option value="split">Photo above, text panel below</option></select></label>
        <label class="field"><span>Text panel (split)</span><select data-s="panel"><option value="dark">Dark</option><option value="light">Light</option></select></label>
      </div>
      <label class="field"><span>Seconds per card: <b id="durLabel">5</b></span><input type="range" min="3" max="10" step="0.5" data-s="dur"></label>
      <div class="grid2">
        <label class="check"><input type="checkbox" data-s="progress"> Progress bar</label>
        <label class="check"><input type="checkbox" data-s="motion"> Motion effects</label>
      </div>
    </section>

    <div class="toolbar">
      <button class="btn" id="addCard" type="button">Add card</button>
      <label class="btn" style="cursor:pointer">Add photos in order<input id="bulk" type="file" accept="image/*" multiple class="vh"></label>
      <button class="btn" id="exportT" type="button">Export template</button>
      <label class="btn" style="cursor:pointer">Import template<input id="importT" type="file" accept="application/json,.json" class="vh"></label>
      <button class="btn ghost" id="resetT" type="button">Reset to samples</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

function textBlock(c,lt,o){
  var L=layoutText(c,o.maxW,o.maxH,o.maxLines),cy=o.anchor==="bottom"?o.y-L.total:o.y;

    ctx.save();ctx.globalAlpha=clamp(a);ctx.translate(o.x,cy+L.chipH/2);var s=mo(.6+.4*a);ctx.scale(s,s);ctx.translate(-o.x,-(cy+L.chipH/2));
    rr(o.x,cy,cw,L.chipH,L.chipH/2);ctx.fillStyle=S.accent;ctx.fill();ctx.fillStyle=onAccent(S.accent);ctx.textBaseline="middle";ctx.fillText(c.cat,o.x+28,cy+L.chipH/2+2);ctx.restore();ctx.textBaseline="top";cy+=L.chipH+L.g1}

  for(var i=0;i<L.lines.length;i++){var b=ease(anim(lt,.15+i*.1,.55));ctx.save();ctx.globalAlpha=b;ctx.translate(mo((1-b)*-0+0),mo((1-b)*70));ctx.font=L.font;ctx.fillStyle=o.head;ctx.textBaseline="top";ctx.fillText(L.lines[i],o.x+mo((1-b)*-50),cy+i*L.size*1.32);ctx.restore()}
  cy+=L.hh;
  if(L.bf){cy+=L.g2;var d0=.3+L.lines.length*.1;for(var k=0;k<L.bf.lines.length;k++){var d=ease(anim(lt,d0+k*.08,.55));ctx.save();ctx.globalAlpha=d;ctx.translate(0,mo((1-d)*40));ctx.font=L.bf.font;ctx.fillStyle=o.sub;ctx.textBaseline="top";ctx.fillText(L.bf.lines[k],o.x,cy+k*L.bf.lh);ctx.restore()}}
}

function drawCard(c,lt,d,idx,n){

    var g=ctx.createLinearGradient(0,H*.3,0,H);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(.55,"rgba(0,0,0,.74)");g.addColorStop(1,"rgba(0,0,0,.95)");ctx.fillStyle=g;ctx.fillRect(0,H*.3,W,H*.7);
    var g3=ctx.createLinearGradient(0,0,0,320);g3.addColorStop(0,"rgba(0,0,0,.6)");g3.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g3;ctx.fillRect(0,0,W,320);

function activeCount(){return cards.filter(function(c){return c.on}).length}

function drawIntro(lt){
  var A=S.accent;bgGrad(A,false);ctx.save();ctx.globalAlpha=.18;ctx.fillStyle=A;ctx.beginPath();ctx.arc(W*.92,H*.12,460+(S.motion?20*Math.sin(lt*2):0),0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W*.05,H*.88,360,0,Math.PI*2);ctx.fill();ctx.restore();
  particles(lt,.2);logoHero(lt,H*.24,170,.1);
  var tf=fitText(S.title||"",W-144,3,150,84,"800",1.3),bh=tf.lines.length*tf.lh,y=H*.5-bh/2;
  ctx.fillStyle=A;ctx.fillRect(72,y-64,220*ease(anim(lt,.4,.6)),12);
  for(var i=0;i<tf.lines.length;i++){var a=ease(anim(lt,.5+i*.12,.6));ctx.save();ctx.globalAlpha=a;ctx.translate(mo((1-a)*-60),0);ctx.font=tf.font;ctx.fillStyle="#fff";ctx.textBaseline="top";ctx.textAlign="left";ctx.fillText(tf.lines[i],72,y+i*tf.lh);ctx.restore()}
  var b=ease(anim(lt,.9,.5));ctx.save();ctx.globalAlpha=b;ctx.translate(0,mo((1-b)*40));ctx.textBaseline="top";ctx.textAlign="left";
  ctx.font="600 56px "+FONT;ctx.fillStyle="rgba(255,255,255,.94)";ctx.fillText(S.date.trim()||autoDate(),72,y+bh+44);
  ctx.font="400 46px "+FONT;ctx.fillStyle=mix(A,"#fff",.6);ctx.fillText(bn(activeCount())+"টি খবর",72,y+bh+128);ctx.restore()}
function drawOutro(lt){
  var A=S.accent;bgGrad(A,true);ctx.save();ctx.globalAlpha=.16;ctx.fillStyle=A;ctx.beginPath();ctx.arc(W*.1,H*.1,420,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W*.95,H*.85,480+(S.motion?20*Math.sin(lt*2):0),0,Math.PI*2);ctx.fill();ctx.restore();
  particles(lt,.18);logoHero(lt,H*.36,200,.1);
  var yy=H*.36+200;ctx.fillStyle=A;var bw=220*ease(anim(lt,.5,.6));ctx.fillRect(W/2-bw/2,yy,bw,12);
  var b=ease(anim(lt,.7,.5));ctx.save();ctx.globalAlpha=b;ctx.translate(0,mo((1-b)*40));ctx.textBaseline="top";ctx.textAlign="center";
  ctx.font="600 64px "+FONT;ctx.fillStyle="rgba(255,255,255,.95)";ctx.fillText(S.outroTitle||"",W/2,yy+56);
  if(S.outroSub){ctx.font="800 48px "+FONT;var sw=ctx.measureText(S.outroSub).width+72,k=S.motion?1+.03*Math.sin(lt*5):1;ctx.save();ctx.translate(W/2,yy+212);ctx.scale(k,k);rr(-sw/2,-44,sw,88,44);ctx.fillStyle=A;ctx.fill();ctx.fillStyle=onAccent(A);ctx.textBaseline="middle";ctx.fillText(S.outroSub,0,2);ctx.restore()}
  ctx.restore();ctx.textAlign="left"}
function segments(){var s=[{type:"intro",d:INTRO}];cards.forEach(function(c){if(c.on)s.push({type:"card",d:Number(S.dur)||5,c:c})});s.push({type:"outro",d:OUTRO});return s}
function total(){return segments().reduce(function(a,s){return a+s.d},0)}
function segAt(t){var segs=segments(),acc=0,i=0;for(;i<segs.length;i++){if(t<acc+segs[i].d)break;acc+=segs[i].d}if(i>=segs.length){i=segs.length-1;acc-=segs[i].d}return{segs:segs,i:i,acc:acc,s:segs[i],lt:clamp(t-acc,0,segs[i].d)}}
function draw(t){
  var q=segAt(t),s=q.s,lt=q.lt,segs=q.segs;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.shadowColor="transparent";ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  var e=S.motion?ease(clamp(lt/WIPE)):1;
  ctx.save();if(e<1){ctx.beginPath();ctx.rect(0,0,W*e,H);ctx.clip()}
  if(s.type==="intro")drawIntro(lt);else if(s.type==="outro")drawOutro(lt);else drawCard(s.c,lt,s.d,q.i-1,segs.length-2);
  ctx.restore();
  if(e<1){ctx.fillStyle=S.accent;ctx.fillRect(W*e-16,0,16,H)}
  var a=clamp((s.d-lt)/.25);if(a<1){ctx.fillStyle="rgba(0,0,0,"+(1-a)+")";ctx.fillRect(0,0,W,H)}
}

/* ---------- playback ---------- */
var t=0,playing=false,last=0,raf=0,recording=false;
function fmt(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function renderTL(){var segs=segments();$("tl").innerHTML=segs.map(function(s,i){var lab=s.type==="intro"?"Intro":s.type==="outro"?"End":String(i);return'<button type="button" data-i="'+i+'" style="flex-grow:'+s.d+'" aria-label="Scene '+lab+'">'+lab+'</button>'}).join("")}
function updateUI(){var T=total();$("scrub").value=String(Math.round(t/T*1000));$("time").textContent=fmt(t)+" / "+fmt(T);var q=segAt(t),b=$("tl").children;if(b.length!==q.segs.length)renderTL();for(var i=0;i<b.length;i++)b[i].className=i===q.i?"cur":""}
$("tl").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||recording)return;var i=Number(b.getAttribute("data-i")),segs=segments(),acc=0;for(var k=0;k<i;k++)acc+=segs[k].d;pause();t=acc+Math.min(1.4,segs[i].d-.01);redraw()});
function tick(now){if(!playing)return;t+=(now-last)/1000;last=now;var T=total();if(t>=T){if(recording){t=T-.001;draw(t);updateUI();finishRec();return}t=0}draw(t);updateUI();raf=requestAnimationFrame(tick)}
function play(){if(playing)return;playing=true;last=performance.now();$("play").textContent="Pause";raf=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(raf);$("play").textContent="Play"}
function redraw(){draw(Math.min(t,total()-.001));updateUI()}

/* ---------- recording ---------- */
var recorder=null,chunks=[],lastBlob=null,lastExt="webm",resUrl=null,recMime="";
async function ensureFonts(){try{await Promise.all(["800","600","400"].map(function(w){return document.fonts.load(w+' 60px "Noto Sans Bengali"',"বাংলা গেজেটা ০১২৩৪৫৬৭৮৯")}))}catch(e){}}
async function startRec(){
  if(recording)return;
  if(typeof MediaRecorder==="undefined"||!cv.captureStream){toast("This browser can't record canvas video. Try Chrome, Edge or Safari 17+.");return}
  pause();await ensureFonts();
  var cands=["video/mp4;codecs=avc1.640028","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  recMime=cands.find(function(m){try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||"";
  var stream=cv.captureStream(30);
  try{recorder=new MediaRecorder(stream,recMime?{mimeType:recMime,videoBitsPerSecond:8000000}:{videoBitsPerSecond:8000000})}catch(e){try{recorder=new MediaRecorder(stream)}catch(e2){toast("Recording could not start in this browser.");return}}
  chunks=[];recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  recording=true;t=0;draw(0);updateUI();
  $("rec").disabled=true;$("play").disabled=true;$("scrub").disabled=true;$("result").hidden=true;
  $("recStatus").textContent="Recording in real time. Keep this tab visible.";
  recorder.start(250);playing=true;last=performance.now();raf=requestAnimationFrame(tick)}
function finishRec(){
  playing=false;cancelAnimationFrame(raf);var type=(recorder&&recorder.mimeType)||recMime||"video/webm";
  recorder.onstop=function(){recording=false;lastBlob=new Blob(chunks,{type:type});lastExt=type.indexOf("mp4")>=0?"mp4":"webm";if(resUrl){try{URL.revokeObjectURL(resUrl)}catch(e){}}resUrl=URL.createObjectURL(lastBlob);$("resVideo").src=resUrl;$("result").hidden=false;$("recStatus").textContent="Done. "+(lastBlob.size/1048576).toFixed(1)+" MB, ."+lastExt;$("rec").disabled=false;$("play").disabled=false;$("scrub").disabled=false;$("play").textContent="Play"};
  try{recorder.requestData()}catch(e){}recorder.stop()}
async function saveFile(name,data){try{var blob=data instanceof Blob?data:new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){try{URL.revokeObjectURL(url)}catch(e){}},5000);toast("Saved");return true}catch(e){toast("Couldn't save: "+((e&&e.message)||"unknown error"));return false}}

$("scrub").addEventListener("input",function(e){pause();t=Number(e.target.value)/1000*total();redraw()});
$("rec").addEventListener("click",startRec);
$("saveVid").addEventListener("click",function(){if(lastBlob)saveFile("news-reel-"+new Date().toISOString().slice(0,10)+"."+lastExt,lastBlob)});

/* ---------- fetch from site (embedded) ---------- */
var FKEY="news-reel-fetch-v2",fopt={count:8,cat:"",today:false};
try{Object.assign(fopt,JSON.parse(localStorage.getItem(FKEY)||"{}"))}catch(e){}
function saveF(){try{localStorage.setItem(FKEY,JSON.stringify(fopt))}catch(e){}}
function apiUrl(path,params,plain){var q=new URLSearchParams(params||{});q.set("key",API_KEY);if(plain){q.set("rest_route","/news-reel/v1"+path);return "/?"+q}return API+path+"?"+q}
async function api(path,params){
  var r;try{r=await fetch(apiUrl(path,params,false));if(r.status===404)r=await fetch(apiUrl(path,params,true))}catch(e){throw new Error("Can't reach banglagazeta.com. Check your connection; if it persists, the site's CORS setting must allow this page.")}
  if(r.status===401||r.status===403)throw new Error("The API key was rejected.");
  if(!r.ok)throw new Error("Server error "+r.status+".");
  try{return await r.json()}catch(e){throw new Error("The site did not return JSON.")}}
async function loadCats(){var sel=$("fCat");sel.length=1;try{var d=await api("/categories");(d.categories||[]).forEach(function(c){var o=document.createElement("option");o.value=String(c.id);o.textContent=c.name+" ("+c.count+")";sel.appendChild(o)});sel.value=String(fopt.cat||"");if(sel.value!==String(fopt.cat||"")){sel.value="";fopt.cat=""}}catch(e){}}
function absUrl(u){try{var x=new URL(u,SITE);if(x.pathname.indexOf("/wp-json/")===0)return x.pathname+x.search;return x.href}catch(e){return u}}
async function getImg(p){var urls=[p.image&&p.image.proxy,p.image&&p.image.url].filter(Boolean).map(absUrl);for(var i=0;i<urls.length;i++){try{var r=await fetch(urls[i]);if(r.ok)return await fileToDataUrl(await r.blob())}catch(e){}}return null}
var fetching=false;
async function fetchPosts(){
  if(fetching||recording)return;fetching=true;var btn=$("fetchBtn"),st=$("fStatus");btn.disabled=true;pause();st.textContent="Fetching posts…";
  try{
    var params={count:fopt.count};if(fopt.cat)params.category=fopt.cat;if(fopt.today)params.today=1;
    var posts=(await api("/posts",params)).posts||[];
    if(!posts.length){st.textContent=fopt.today?"No posts published today. Untick “Today only” for the latest ones.":"No published posts found for that selection.";return}
    var next=posts.map(function(p){return{on:true,cat:p.category||"",head:p.title||"",blurb:p.excerpt||"",img:null,_el:null,_p:p}});
    cards=next;t=0;renderList();persist();renderTL();redraw();
    var withImg=next.filter(function(c){return c._p.image}).length,done=0;if(withImg)st.textContent="Loading photos 0/"+withImg+"…";
    await Promise.all(next.map(async function(c){if(!c._p.image)return;c.img=await getImg(c._p);c._el=await loadEl(c.img);done++;st.textContent="Loading photos "+done+"/"+withImg+"…";redraw()}));
    var ok=next.filter(function(c){return c.img}).length;renderList();redraw();
    st.textContent=next.length+" posts loaded, "+ok+" with photos."+(ok<next.length?" Add photos to the rest below.":" Press Play or Record video.");
  }catch(e){st.textContent="Fetch failed: "+((e&&e.message)||"unknown error")}finally{fetching=false;btn.disabled=false}}
function initFetch(){$("fCount").value=String(fopt.count);if($("fCount").value!==String(fopt.count))$("fCount").value="8";$("fToday").checked=!!fopt.today;
  $("fCount").addEventListener("change",function(){fopt.count=Number($("fCount").value);saveF()});$("fCat").addEventListener("change",function(){fopt.cat=$("fCat").value;saveF()});$("fToday").addEventListener("change",function(){fopt.today=$("fToday").checked;saveF()});$("fetchBtn").addEventListener("click",fetchPosts);loadCats()}

/* ---------- init ---------- */
restore();initFetch();syncSettings();renderList();renderTL();draw(0);updateUI();
ensureFonts().then(redraw);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
})();
</script>
</body>
</html>
