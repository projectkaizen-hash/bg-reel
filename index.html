<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangla Gazeta · Reel Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'media',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', 'VarendraAP', 'Noto Sans Bengali', 'system-ui', 'sans-serif'],
      },
    },
  },
}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
@font-face {
  font-family: 'VarendraAP';
  src: url('VarendraAP-Regular_v4.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
</style>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:"Inter","Noto Sans Bengali",system-ui,-apple-system,sans-serif}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{background:#000;overflow:hidden;width:100%;max-width:380px;margin:0 auto;aspect-ratio:9/16;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.stage canvas{display:block;width:100%;height:100%}
#tl{display:flex;gap:2px;height:32px}
#tl button{flex:1 1 0;min-width:0;border:0;border-radius:4px;background:#f1f5f9;color:#64748b;font-size:11px;cursor:pointer;overflow:hidden;white-space:nowrap;border:1px solid #e2e8f0;padding:0 2px;transition:all .15s}
#tl button.cur{background:#0f172a;color:#fff;border-color:#0f172a;font-weight:500}
#tl button.off{opacity:.4}
@media (min-width:1024px){.left-panel{max-height:calc(100vh - 100px);overflow-y:auto}}
@media (max-width:1023px){.app{grid-template-columns:1fr}.left-panel{position:static}}
@media (max-width:640px){.card-body{grid-template-columns:80px minmax(0,1fr)}.thumb{width:80px}}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen">
<header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <svg class="logo w-8 h-8" id="topLogo" viewBox="0 0 96 96" aria-hidden="true"></svg>
        <div>
          <h1 class="text-lg font-semibold text-slate-900 dark:text-slate-50">Reel Studio</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Bangla Gazeta · 1080×1920 news reels</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          banglagazeta.com connected
        </span>
        <button class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-slate-900 dark:bg-slate-50 dark:text-slate-900 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-200 transition-colors" id="rec" type="button">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          Render video
        </button>
      </div>
    </div>
  </div>
</header>

<div class="app max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-[380px_minmax(0,1fr)] gap-8 items-start">
  <aside class="left-panel flex flex-col gap-4" aria-label="Preview">
    <div class="stage"><canvas id="cv" width="1080" height="1920" aria-label="Reel preview"></canvas></div>
    <div class="flex items-center gap-3 bg-white dark:bg-slate-900 rounded-lg p-3 border border-slate-200 dark:border-slate-800">
      <button class="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" id="play" type="button">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline" class="flex-1 h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-900 dark:accent-slate-50">
      <span class="time text-sm text-slate-500 dark:text-slate-400 font-mono" id="time">0:00 / 0:00</span>
    </div>
    <div id="tl" aria-label="Scenes"></div>
    <div class="flex items-center gap-2"><span class="status text-sm text-slate-500 dark:text-slate-400" id="recStatus"></span></div>
  </aside>

  <main class="space-y-6">
    <section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm" aria-labelledby="hs">
      <h2 id="hs" class="text-sm font-semibold text-slate-900 dark:text-slate-50 uppercase tracking-wider mb-4">Source</h2>
      <div class="flex flex-wrap items-center gap-3">
        <button class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-slate-900 dark:bg-slate-50 dark:text-slate-900 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-200 transition-colors" id="fetchBtn" type="button">Fetch posts</button>
        <label class="inline-flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400"><span>Date</span><input type="date" id="fDate" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"></label>
        <button class="inline-flex items-center px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-50 transition-colors" id="fDateClear" type="button">Latest</button>
        <label class="inline-flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400"><span>Category</span><select id="fCat" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"><option value="">All categories</option></select></label>
        <span class="status text-sm text-slate-500 dark:text-slate-400" id="fStatus" role="status"></span>
      </div>
    </section>

    <section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm" aria-labelledby="sh">
      <h2 id="sh" class="text-sm font-semibold text-slate-900 dark:text-slate-50 uppercase tracking-wider mb-4">Brand and style</h2>
      <div class="flex items-center gap-3 mb-6"><img id="logoImg" alt="Logo preview" class="h-10 max-w-[160px] object-contain bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1">
        <label class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer transition-colors">Upload logo (SVG/PNG)<input id="logoUp" type="file" accept="image/svg+xml,image/png,image/webp,image/jpeg" class="vh"></label>
        <button class="inline-flex items-center px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-50 transition-colors" id="logoReset" type="button">Use default</button></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Brand name (beside default logo)</span><input type="text" data-s="brand" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"></label>
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Opening title</span><input type="text" data-s="title" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"></label>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Date line (empty = today)</span><input type="text" data-s="date" placeholder="Auto" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"></label>
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Closing headline</span><input type="text" data-s="outroTitle" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"></label>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Closing link</span><input type="text" data-s="outroSub" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"></label>
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Accent colour</span><input type="color" data-s="accent" class="w-full h-10 px-1 py-1 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 cursor-pointer"></label>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Card layout</span><select data-s="layout" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"><option value="overlay">Full photo, text on top</option><option value="split">Photo above, text panel below</option></select></label>
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Text panel (split)</span><select data-s="panel" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-slate-50"><option value="dark">Dark</option><option value="light">Light</option></select></label>
      </div>
      <label class="flex flex-col gap-1.5 mt-4"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Seconds per card: <b id="durLabel" class="text-slate-900 dark:text-slate-50">5</b></span><input type="range" min="3" max="10" step="0.5" data-s="dur" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-900 dark:accent-slate-50"></label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <label class="inline-flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" data-s="progress" class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-50 focus:ring-slate-900 dark:focus:ring-slate-50"> Progress bar</label>
        <label class="inline-flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" data-s="motion" class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-50 focus:ring-slate-900 dark:focus:ring-slate-50"> Motion effects</label>
      </div>
    </section>

    <section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm" aria-labelledby="sa">
      <h2 id="sa" class="text-sm font-semibold text-slate-900 dark:text-slate-50 uppercase tracking-wider mb-4">Audio</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Background music</span><label class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer transition-colors">Upload audio<input id="bgMusicUp" type="file" accept="audio/*" class="vh"></label></label>
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Transition sound</span><label class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer transition-colors">Upload audio<input id="transSoundUp" type="file" accept="audio/*" class="vh"></label></label>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Music volume: <b id="musicVolLabel" class="text-slate-900 dark:text-slate-50">50</b>%</span><input type="range" min="0" max="100" data-s="musicVol" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-900 dark:accent-slate-50"></label>
        <label class="flex flex-col gap-1.5"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">Sound volume: <b id="soundVolLabel" class="text-slate-900 dark:text-slate-50">70</b>%</span><input type="range" min="0" max="100" data-s="soundVol" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-900 dark:accent-slate-50"></label>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <label class="inline-flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" data-s="enableMusic" class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-50 focus:ring-slate-900 dark:focus:ring-slate-50"> Enable background music</label>
        <label class="inline-flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" data-s="enableSound" class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-50 focus:ring-slate-900 dark:focus:ring-slate-50"> Enable transition sounds</label>
      </div>
      <div class="flex flex-wrap items-center gap-3 mt-4">
        <button class="inline-flex items-center px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-50 transition-colors" id="audioReset" type="button">Clear audio files</button>
        <span class="status text-sm text-slate-500 dark:text-slate-400" id="audioStatus"></span>
      </div>
    </section>

    <div class="flex flex-wrap gap-2">
      <button class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" id="addCard" type="button">Add card</button>
      <label class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer transition-colors">Add photos in order<input id="bulk" type="file" accept="image/*" multiple class="vh"></label>
      <button class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" id="exportT" type="button">Export template</button>
      <label class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer transition-colors">Import template<input id="importT" type="file" accept="application/json,.json" class="vh"></label>
      <button class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-50 transition-colors" id="resetT" type="button">Reset to samples</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<!-- Rendering Modal -->
<div id="renderModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="modalBackdrop"></div>
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
      <!-- Rendering State -->
      <div id="renderingState" class="p-8 text-center">
        <div class="mb-6">
          <div class="relative w-20 h-20 mx-auto">
            <div class="absolute inset-0 border-4 border-slate-200 dark:border-slate-700 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-slate-900 dark:border-slate-50 rounded-full border-t-transparent animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
              <svg class="w-8 h-8 text-slate-900 dark:text-slate-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
              </svg>
            </div>
          </div>
        </div>
        <h3 class="text-xl font-semibold text-slate-900 dark:text-slate-50 mb-2">Rendering Video</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4" id="renderStatus">Preparing to render...</p>
        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 mb-4">
          <div id="renderProgress" class="bg-slate-900 dark:bg-slate-50 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p class="text-xs text-slate-400 dark:text-slate-500" id="renderTime">Estimated time: Calculating...</p>
      </div>

      <!-- Complete State -->
      <div id="completeState" class="p-8 text-center hidden">
        <div class="mb-6">
          <div class="w-20 h-20 mx-auto bg-emerald-100 dark:bg-emerald-950 rounded-full flex items-center justify-center">
            <svg class="w-10 h-10 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
        </div>
        <h3 class="text-xl font-semibold text-slate-900 dark:text-slate-50 mb-2">Render Complete!</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6" id="renderResult">Your video is ready to download</p>
        <video id="previewVideo" controls class="w-full rounded-lg bg-black mb-4 max-h-[200px] hidden"></video>
        <div class="flex gap-3">
          <button id="downloadBtn" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-medium text-white bg-slate-900 dark:bg-slate-50 dark:text-slate-900 rounded-lg hover:bg-slate-800 dark:hover:bg-slate-200 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Download Video
          </button>
          <button id="closeModal" class="inline-flex items-center justify-center px-4 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast fixed left-1/2 bottom-6 -translate-x-1/2 bg-slate-900 dark:bg-slate-50 text-white dark:text-slate-900 px-4 py-3 rounded-lg text-sm max-w-[92vw] max-w-[460px] z-50 hidden" id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- embedded connection ---------- */
var SITE="https://banglagazeta.com", API_KEY="DjVf3drWcsQjwlsjv3Y82M0214VaEiFK1QPORd3f", API="/wp-json/news-reel/v1";

var W=1080,H=1920,INTRO=3,OUTRO=3.4,WIPE=.55;

function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
function autoDate(){var d=new Date();return bn(d.getDate())+" "+MONTHS[d.getMonth()]+" "+bn(d.getFullYear())}
function clamp(v,a,b){return Math.min(b===undefined?1:b,Math.max(a===undefined?0:a,v))}
function ease(x){return 1-Math.pow(1-x,3)}
function back(x){var c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}
function anim(lt,d,u){return clamp((lt-d)/u)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function $(id){return document.getElementById(id)}
function hex2rgb(h){h=String(h||"#000").replace("#","");if(h.length===3)h=h.split("").map(function(x){return x+x}).join("");var n=parseInt(h,16);if(isNaN(n))n=0;return[(n>>16)&255,(n>>8)&255,n&255]}
function mix(h,t,a){var c=hex2rgb(h),d=hex2rgb(t);return"rgb("+c.map(function(v,i){return Math.round(v+(d[i]-v)*a)}).join(",")+")"}

/* ---------- images & logo ---------- */
function loadEl(u){return new Promise(function(res){if(!u){res(null);return}var im=new Image();im.onload=function(){res(im)};im.onerror=function(){res(null)};im.src=u})}
function fileToDataUrl(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var sc=Math.min(1,1920/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};im.src=fr.result};fr.readAsDataURL(file)})}
async function setPhoto(card,file){try{card.img=await fileToDataUrl(file);card._el=await loadEl(card.img)}catch(e){toast("That image could not be read. Try a JPG or PNG.")}}
var logoCache={};

function syncLogoUI(){$("logoImg").src=logoSrc();$("topLogo").innerHTML=logoInner(S.accent)}

var bgAudioEl=null,transAudioEl=null,prevSegIdx=-1;

function playBgMusic(){if(S.enableMusic&&bgAudioEl){bgAudioEl.volume=(S.musicVol||50)/100;bgAudioEl.currentTime=0;bgAudioEl.play().catch(function(){})}}

function updateAudioStatus(){var st=$("audioStatus");if(!S.bgMusic&&!S.transSound)st.textContent="No audio files loaded";else st.textContent=(S.bgMusic?"Music ":"")+(S.transSound?"Sound ":"")+"loaded"}

/* ---------- canvas ---------- */
var cv=$("cv"),ctx=cv.getContext("2d",{alpha:false});
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function rrBottom(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.closePath()}
function drawCover(img,x,y,w,h,z,pan){var ir=img.width/img.height,r=w/h,sw,sh;if(ir>r){sh=img.height;sw=sh*r}else{sw=img.width;sh=sw/r}sw/=z;sh/=z;var sx=(img.width-sw)/2*(1+(pan||0)),sy=(img.height-sh)/2;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.restore()}
function particles(lt,alpha){if(!S.motion)return;ctx.save();ctx.fillStyle="#fff";for(var i=0;i<16;i++){var x=(i*197+40)%W,y=H-((lt*(40+i%4*18)+i*173)%H),r=4+(i%5)*3;ctx.globalAlpha=alpha*(.5+.5*Math.sin(lt*2+i));ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawPlaceholder(x,y,w,h,A,lt,cat){var g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,mix(A,"#000",.45));g.addColorStop(1,"#0a0d0c");ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.globalAlpha=.16;ctx.fillStyle=A;ctx.beginPath();ctx.arc(x+w*.85,y+h*.22,380+18*Math.sin(lt*1.5),0,Math.PI*2);ctx.fill();ctx.globalAlpha=.09;ctx.beginPath();ctx.arc(x+w*.08,y+h*.7,300,0,Math.PI*2);ctx.fill();if(cat){ctx.globalAlpha=.07;ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="800 300px "+FONT;ctx.fillText(cat,x+w/2,y+h*.4)}ctx.restore();ctx.textAlign="left"}
function wrap(text,maxW,font){ctx.font=font;var words=String(text).split(/\s+/).filter(Boolean),lines=[],cur="";for(var i=0;i<words.length;i++){var t=cur?cur+" "+words[i]:words[i];if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=words[i]}else cur=t}if(cur)lines.push(cur);return lines}
function fitText(text,maxW,maxLines,maxSize,minSize,weight,lh){var size,font,lines;for(size=maxSize;size>=minSize;size-=4){font=weight+" "+size+"px "+FONT;lines=wrap(text,maxW,font);if(lines.length<=maxLines)return{lines:lines,size:size,font:font,lh:size*lh}}size=minSize;font=weight+" "+size+"px "+FONT;lines=wrap(text,maxW,font);if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,"")+"…"}return{lines:lines,size:size,font:font,lh:size*lh}}
function layoutText(c,maxW,maxH,maxLines){var chipH=70,g1=34,g2=26;for(var size=130;;size-=3){var font="800 "+size+"px "+FONT,lines=wrap(c.head||"",maxW,font);if(lines.length>maxLines&&size>60)continue;var bf=c.blurb?fitText(c.blurb,maxW,3,42,32,"400",1.5):null,hh=lines.length*size*1.15,bh=bf?bf.lines.length*bf.lh:0,total=(c.cat?chipH+g1:0)+hh+(bf?g2+bh:0);if(total<=maxH||size<=60)return{size:size,font:font,lines:lines,bf:bf,hh:hh,bh:bh,total:total,chipH:chipH,g1:g1,g2:g2}}}
function mo(v){return S.motion?v:1}

/* brand: logo (+ name beside default logo) */
function brandWidth(h,fs){var im=getLogo(),w=im?h*im.width/im.height:h;if(!S.logo&&S.brand){ctx.font="800 "+fs+"px "+FONT;w+=18+ctx.measureText(S.brand).width}return w}
function drawBrand(x,y,h,fs,color){var im=getLogo(),w=h;if(im){w=h*im.width/im.height;ctx.drawImage(im,x,y,w,h)}if(!S.logo&&S.brand){ctx.font="800 "+fs+"px "+FONT;ctx.fillStyle=color;ctx.textBaseline="middle";ctx.textAlign="left";ctx.fillText(S.brand,x+w+18,y+h/2+2)}}

function textBlock(c,lt,o){
  var L=layoutText(c,o.maxW,o.maxH,o.maxLines),cy=o.anchor==="bottom"?o.y-L.total:o.y;
  ctx.textBaseline="top";ctx.textAlign="left";
  if(c.cat){var a=back(anim(lt,0,.5));ctx.font="800 36px "+FONT;var cw=ctx.measureText(c.cat).width+56;
    ctx.save();ctx.globalAlpha=clamp(a);ctx.translate(o.x,cy+L.chipH/2);var s=mo(.6+.4*a);ctx.scale(s,s);ctx.translate(-o.x,-(cy+L.chipH/2));
    rr(o.x,cy,cw,L.chipH,L.chipH/2);ctx.fillStyle=S.accent;ctx.fill();ctx.fillStyle=onAccent(S.accent);ctx.textBaseline="middle";ctx.fillText(c.cat,o.x+28,cy+L.chipH/2+2);ctx.restore();ctx.textBaseline="top";cy+=L.chipH+L.g1}
  ctx.font=L.font;ctx.fillStyle=o.head;
  for(var i=0;i<L.lines.length;i++){var b=ease(anim(lt,.15+i*.1,.55));ctx.save();ctx.globalAlpha=b;ctx.translate(mo((1-b)*-0+0),mo((1-b)*70));ctx.font=L.font;ctx.fillStyle=o.head;ctx.textBaseline="top";ctx.fillText(L.lines[i],o.x+mo((1-b)*-50),cy+i*L.size*1.15);ctx.restore()}
  cy+=L.hh;
  if(L.bf){cy+=L.g2;var d0=.3+L.lines.length*.1;for(var k=0;k<L.bf.lines.length;k++){var d=ease(anim(lt,d0+k*.08,.55));ctx.save();ctx.globalAlpha=d;ctx.translate(0,mo((1-d)*40));ctx.font=L.bf.font;ctx.fillStyle=o.sub;ctx.textBaseline="top";ctx.fillText(L.bf.lines[k],o.x,cy+k*L.bf.lh);ctx.restore()}}
}
function brandBar(lt){
  var a=ease(anim(lt,0,.5));ctx.save();ctx.globalAlpha=a;ctx.translate(mo((1-a)*-40),0);
  var bw=brandWidth(56,34)+48;rr(72,86,bw,84,42);ctx.fillStyle="rgba(0,0,0,.5)";ctx.fill();drawBrand(96,100,56,34,"#fff");
  ctx.restore();ctx.save();ctx.globalAlpha=a;ctx.font="600 32px "+FONT;ctx.fillStyle="#fff";ctx.textAlign="right";ctx.textBaseline="middle";ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=10;ctx.fillText(S.date.trim()||autoDate(),W-72,130);ctx.restore();ctx.textAlign="left"}
function progressBar(idx,n,p){if(!S.progress||n<1)return;var gap=8,tot=W-144,w=(tot-gap*(n-1))/n;for(var i=0;i<n;i++){var x=72+i*(w+gap);rr(x,50,w,8,4);ctx.fillStyle="rgba(255,255,255,.28)";ctx.fill();var f=i<idx?1:i===idx?p:0;if(f>0){rr(x,50,Math.max(8,w*f),8,4);ctx.fillStyle="#fff";ctx.fill()}}}
function footer(c,color,y,lt){ctx.restore()}

function drawCard(c,lt,d,idx,n){
  var p=lt/d,zoom=S.motion?1.1+.14*p:1,pan=S.motion?(idx%2?1:-1)*(p*2-1)*.8:0,padX=72,maxW=W-padX*2;
  if(S.layout==="split"){
    var light=S.panel==="light";ctx.fillStyle=light?"#f6f3ec":"#0d1110";ctx.fillRect(0,0,W,H);var ph=1080;
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,ph);ctx.clip();
    if(c._el)drawCover(c._el,0,0,W,ph,zoom,pan);else drawPlaceholder(0,0,W,ph,S.accent,lt,c.cat);
    var g2=ctx.createLinearGradient(0,0,0,320);g2.addColorStop(0,"rgba(0,0,0,.6)");g2.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g2;ctx.fillRect(0,0,W,320);ctx.restore();
    textBlock(c,lt,{x:padX,maxW:maxW,y:ph+64,anchor:"top",maxH:H-190-(ph+64),maxLines:4,head:S.accent,sub:light?"#4b5359":"#c5cdc9"});
    footer(c,light?"#4b5359":"#c5cdc9",H-120,lt);
  }else{
    if(c._el)drawCover(c._el,0,0,W,H,zoom,pan);else drawPlaceholder(0,0,W,H,S.accent,lt,c.cat);
    var g=ctx.createLinearGradient(0,H*.3,0,H);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(.55,"rgba(0,0,0,.74)");g.addColorStop(1,"rgba(0,0,0,.95)");ctx.fillStyle=g;ctx.fillRect(0,H*.3,W,H*.7);
    var g3=ctx.createLinearGradient(0,0,0,320);g3.addColorStop(0,"rgba(0,0,0,.6)");g3.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g3;ctx.fillRect(0,0,W,320);
    textBlock(c,lt,{x:padX,maxW:maxW,y:H-190,anchor:"bottom",maxH:1000,maxLines:5,head:S.accent,sub:"#dfe4e1"});
    footer(c,"rgba(255,255,255,.82)",H-120,lt);
  }
  brandBar(lt);progressBar(idx,n,p);
}
function activeCount(){return cards.filter(function(c){return c.on}).length}
function bgGrad(A,rev){var g=rev?ctx.createLinearGradient(0,H,W,0):ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,mix(A,"#000",.5));g.addColorStop(1,"#070908");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function logoHero(lt,cy,h,delay){
  var e=back(anim(lt,delay,.8)),A=S.accent,bw=brandWidth(h,h*.42),cx=W/2;
  if(S.motion){for(var r=0;r<3;r++){var q=((lt*.6+r/3)%1);ctx.save();ctx.globalAlpha=(1-q)*.35*clamp(lt/.6);ctx.strokeStyle=A;ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,h*.6+q*420,0,Math.PI*2);ctx.stroke();ctx.restore()}}
  ctx.save();ctx.globalAlpha=clamp(e);ctx.translate(cx,cy);var s=mo(.4+.6*e);ctx.scale(s,s);drawBrand(-bw/2,-h/2,h,h*.42,"#fff");ctx.restore()}
function drawIntro(lt){
  var A=S.accent;bgGrad(A,false);ctx.save();ctx.globalAlpha=.18;ctx.fillStyle=A;ctx.beginPath();ctx.arc(W*.92,H*.12,460+(S.motion?20*Math.sin(lt*2):0),0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W*.05,H*.88,360,0,Math.PI*2);ctx.fill();ctx.restore();
  particles(lt,.2);logoHero(lt,H*.24,170,.1);
  var tf=fitText(S.title||"",W-144,3,120,84,"800",1.3),bh=tf.lines.length*tf.lh,y=H-300-bh;
  ctx.fillStyle=A;ctx.fillRect(72,y-64,220*ease(anim(lt,.4,.6)),12);
  for(var i=0;i<tf.lines.length;i++){var a=ease(anim(lt,.5+i*.12,.6));ctx.save();ctx.globalAlpha=a;ctx.translate(mo((1-a)*-60),0);ctx.font=tf.font;ctx.fillStyle="#fff";ctx.textBaseline="top";ctx.textAlign="left";ctx.fillText(tf.lines[i],72,y+i*tf.lh);ctx.restore()}
  var b=ease(anim(lt,.9,.5));ctx.save();ctx.globalAlpha=b;ctx.translate(0,mo((1-b)*40));ctx.textBaseline="top";ctx.textAlign="left";
  ctx.font="600 56px "+FONT;ctx.fillStyle="rgba(255,255,255,.94)";ctx.fillText(S.date.trim()||autoDate(),72,y+bh+44);
  ctx.font="400 46px "+FONT;ctx.fillStyle=mix(A,"#fff",.6);ctx.fillText(bn(activeCount())+"টি খবর",72,y+bh+128);ctx.restore()}
function drawOutro(lt){
  var A=S.accent;bgGrad(A,true);ctx.save();ctx.globalAlpha=.16;ctx.fillStyle=A;ctx.beginPath();ctx.arc(W*.1,H*.1,420,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W*.95,H*.85,480+(S.motion?20*Math.sin(lt*2):0),0,Math.PI*2);ctx.fill();ctx.restore();
  particles(lt,.18);logoHero(lt,H*.36,200,.1);
  var yy=H*.36+200;ctx.fillStyle=A;var bw=220*ease(anim(lt,.5,.6));ctx.fillRect(W/2-bw/2,yy,bw,12);
  var b=ease(anim(lt,.7,.5));ctx.save();ctx.globalAlpha=b;ctx.translate(0,mo((1-b)*40));ctx.textBaseline="top";ctx.textAlign="center";
  ctx.font="600 64px "+FONT;ctx.fillStyle="rgba(255,255,255,.95)";ctx.fillText(S.outroTitle||"",W/2,yy+56);
  if(S.outroSub){ctx.font="800 48px "+FONT;var sw=ctx.measureText(S.outroSub).width+72,k=S.motion?1+.03*Math.sin(lt*5):1;ctx.save();ctx.translate(W/2,yy+212);ctx.scale(k,k);rr(-sw/2,-44,sw,88,44);ctx.fillStyle=A;ctx.fill();ctx.fillStyle=onAccent(A);ctx.textBaseline="middle";ctx.fillText(S.outroSub,0,2);ctx.restore()}
  ctx.restore();ctx.textAlign="left"}
function segments(){var s=[{type:"intro",d:INTRO}];cards.forEach(function(c){if(c.on)s.push({type:"card",d:Number(S.dur)||5,c:c})});s.push({type:"outro",d:OUTRO});return s}
function total(){return segments().reduce(function(a,s){return a+s.d},0)}
function segAt(t){var segs=segments(),acc=0,i=0;for(;i<segs.length;i++){if(t<acc+segs[i].d)break;acc+=segs[i].d}if(i>=segs.length){i=segs.length-1;acc-=segs[i].d}return{segs:segs,i:i,acc:acc,s:segs[i],lt:clamp(t-acc,0,segs[i].d)}}
function draw(t){
  var q=segAt(t),s=q.s,lt=q.lt,segs=q.segs;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.shadowColor="transparent";ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  var e=S.motion?ease(clamp(lt/WIPE)):1;
  ctx.save();if(e<1){ctx.beginPath();ctx.rect(0,0,W*e,H);ctx.clip()}
  if(s.type==="intro")drawIntro(lt);else if(s.type==="outro")drawOutro(lt);else drawCard(s.c,lt,s.d,q.i-1,segs.length-2);
  ctx.restore();
  if(e<1){ctx.fillStyle=S.accent;ctx.fillRect(W*e-16,0,16,H)}
  var a=clamp((s.d-lt)/.25);if(a<1){ctx.fillStyle="rgba(0,0,0,"+(1-a)+")";ctx.fillRect(0,0,W,H)}
}

async function setupAudioForRecording(){
  if(!S.enableMusic&&!S.enableSound)return cv.captureStream(30);
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
    var dest=audioCtx.createMediaStreamDestination();
    destNode=dest;
    var canvasStream=cv.captureStream(30);
    var combinedTracks=canvasStream.getTracks();
    if(S.enableMusic&&S.bgMusic){
      var audio=new Audio(S.bgMusic);
      audio.loop=true;
      audio.volume=(S.musicVol||50)/100;
      audio.crossOrigin="anonymous";
      bgSource=audioCtx.createMediaElementSource(audio);
      var gain=audioCtx.createGain();
      gain.gain.value=S.musicVol/100;
      bgSource.connect(gain).connect(dest);
      audio.play();
    }
    if(S.enableSound&&S.transSound){
      var transAudio=new Audio(S.transSound);
      transAudio.loop=false;
      transAudio.volume=(S.soundVol||70)/100;
      transAudio.crossOrigin="anonymous";
      transSource=audioCtx.createMediaElementSource(transAudio);
      var transGain=audioCtx.createGain();
      transGain.gain.value=S.soundVol/100;
      transSource.connect(transGain).connect(dest);
    }
    combinedTracks=combinedTracks.concat(dest.stream.getAudioTracks());
    return new MediaStream(combinedTracks);
  }catch(e){console.warn("Audio setup failed, recording video only",e);return cv.captureStream(30)}
}

  if(!cards.length)list.innerHTML='<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-8">No cards yet. Add one to start.</p>'}

var fetching=false;
async function fetchPosts(){
  if(fetching||recording)return;fetching=true;var btn=$("fetchBtn"),st=$("fStatus");btn.disabled=true;pause();st.textContent="Fetching posts…";
  try{
    var params={count:50};
    if(fopt.cat)params.category=fopt.cat;
    if(fopt.date){params.date=fopt.date;params.after=fopt.date+"T00:00:00";params.before=fopt.date+"T23:59:59"}
    var posts=(await api("/posts",params)).posts||[];
    if(fopt.date){posts=posts.filter(function(p){var d=p.date||p.published||p.post_date;return !d||String(d).slice(0,10)===fopt.date})}
    else posts=posts.slice(0,8);
    if(!posts.length){st.textContent=fopt.date?"No posts found for "+fopt.date+".":"No published posts found for that selection.";return}
    var next=posts.map(function(p){return{on:true,cat:p.category||"",head:p.title||"",blurb:p.excerpt||"",img:null,_el:null,_p:p}});

}
